name: Ask a rules question
description: Something in the rules is unclear
title: "[Question] "
labels: ["question"]
body:
  - type: input
    id: refs
    attributes:
      label: Rule reference (section and page)
      placeholder: "§10.3, p.30"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: The question
    validations:
      required: true
  - type: textarea
    id: readings
    attributes:
      label: Possible readings
      description: If there is more than one way to read it, list each.
